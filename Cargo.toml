[package]
name = "subforge"
version = "0.2.0"
edition = "2024"
# Edition 2024 requires 1.85, but we also use stabilized let-chains in
# `if let X && let Y { ... }` form (stable since 1.88).
rust-version = "1.88"
license = "MIT"
description = "Video subtitle pipeline: transcribe → segment → translate → quality estimate → burn"
repository = "https://github.com/deusjin/subforge"
readme = "README.md"
keywords = ["subtitle", "translation", "whisper", "ffmpeg", "video"]
categories = ["command-line-utilities", "multimedia::video"]

[lib]
name = "subforge"
path = "src/lib.rs"

[[bin]]
name = "subforge"
path = "src/main.rs"

[[bench]]
name = "client_reuse"
path = "benches/client_reuse.rs"
harness = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "time", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "native-tls", "stream"] }
encoding_rs = "0.8"
sha2 = "0.10"
hex = "0.4"
# fcntl-style advisory file locking for concurrent-safe TM updates.
# fs4 is the maintained successor of fs2 (rustix-based, async-aware).
fs4 = "0.13"
# Touch cache file mtime on hit so cache_prune's LRU eviction works correctly
# (without it, frequently-used entries get evicted alongside cold ones).
filetime = "0.2"

[dev-dependencies]
tempfile = "3"
