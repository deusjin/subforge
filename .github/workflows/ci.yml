name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        # Allow the legacy `field_reassign_with_default` style in tests.
        run: cargo clippy --all-targets -- -A clippy::field_reassign_with_default
      - name: cargo build
        run: cargo build --all-targets
      - name: cargo test
        run: cargo test --all-targets

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: reject host-specific paths and retired repository links
        shell: bash
        run: |
          set -euo pipefail
          needles=(
            "/""home/"
            "/""Users/"
            "/""Volumes/"
            "/""mnt/"
            "C:""/""Users/"
            "github.com/""ti""ga"
          )
          windows_user_prefix="C:"
          windows_user_prefix="${windows_user_prefix}\\"
          windows_user_prefix="${windows_user_prefix}Users"
          windows_user_prefix="${windows_user_prefix}\\"
          needles+=("$windows_user_prefix")
          while IFS= read -r commit; do
            for needle in "${needles[@]}"; do
              if git grep -n -I -F "$needle" "$commit" -- .; then
                echo "Host-specific paths or retired repository links exist in Git history at $commit."
                exit 1
              fi
            done
          done < <(git rev-list --all)
